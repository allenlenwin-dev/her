<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Valentine's Day</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #ff69b4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(139, 90, 90, 0.2);
            border: 3px solid #FFB6C1;
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
        }
        
        h1 {
            color: #D87093;
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            line-height: 1.3;
            padding: 0 10px;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        button {
            padding: 15px 30px;
            font-size: clamp(1.2rem, 4vw, 2rem);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            min-width: 140px;
            flex: 1;
            max-width: 200px;
        }
        
        #yes {
            background-color: #FFB6C1;
            color: #8B5A5A;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.4);
        }
        
        #yes:hover, #yes:active {
            background-color: #FF9EB5;
            transform: scale(1.05);
        }
        
        #no {
            background-color: #F5F5DC;
            color: #8B5A5A;
            border: 3px solid #FFB6C1;
            box-shadow: 0 5px 15px rgba(139, 90, 90, 0.2);
        }
        
        #no:hover, #no:active {
            background-color: #FFE4E9;
        }
        
        .heart {
            position: absolute;
            color: #f8f8f8;
            font-size: 16px;
            animation: float 6s linear infinite;
            opacity: 0.7;
            z-index: 1;
            pointer-events: none;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }   
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .quote {
            margin-top: 15px;
            color: #D87093;
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-style: italic;
            min-height: 30px;
            opacity: 0;
            transition: opacity 0.5s ease;
            padding: 0 10px;
            line-height: 1.4;
        }
        
        .quote.show {
            opacity: 1;
        }
        
        /* Mobile-specific optimizations */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .container {
                padding: 15px;
                border-radius: 15px;
            }
            
            h1 {
                margin-bottom: 25px;
                font-size: 1.8rem;
            }
            
            .buttons {
                gap: 12px;
                flex-direction: row;
            }
            
            button {
                padding: 14px 20px;
                min-width: 120px;
                font-size: 1.3rem;
            }
            
            .heart {
                font-size: 14px;
            }
        }
        
        @media (max-width: 360px) {
            h1 {
                font-size: 1.5rem;
            }
            
            button {
                padding: 12px 16px;
                min-width: 110px;
                font-size: 1.1rem;
            }
        }
        
        /* Prevent text selection on buttons */
        button {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Touch-friendly hover states */
        @media (hover: none) {
            #yes:hover, #no:hover {
                transform: none;
            }
            
            #yes:active, #no:active {
                transform: scale(0.98);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will you be my Valentine?</h1>
        <div class="buttons">
            <button id="yes">YES</button>
            <button id="no">NO</button>
        </div>
        <div class="quote" id="quote"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const yesBtn = document.getElementById('yes');
            const noBtn = document.getElementById('no');
            const quote = document.getElementById('quote');
            
            let yesSize = 1;
            let clickCount = 0;
            
            const quotes = [
                "Are you sure? 😢",
                "Please say yes! ❤️",
                "My heart will break... 💔"
            ];
            
            function createHeart() {
                const heart = document.createElement('div');
                heart.innerHTML = '❤';
                heart.classList.add('heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 16 + 12) + 'px';
                heart.style.animationDuration = (Math.random() * 4 + 3) + 's';
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }
            
            setInterval(createHeart, 300);
            
            noBtn.addEventListener('click', function() {
                clickCount++;
                yesSize += 0.1;
                yesBtn.style.transform = `scale(${yesSize})`;
                
                const moveX = Math.random() * 100 - 50;
                const moveY = Math.random() * 100 - 50;
                noBtn.style.transform = `translate(${moveX}px, ${moveY}px)`;
                
                if (clickCount <= 3) {
                    quote.textContent = quotes[clickCount - 1];
                    quote.classList.remove('show');
                    setTimeout(() => quote.classList.add('show'), 10);
                }
                
                if (clickCount >= 4) {
                    noBtn.style.display = 'none';
                    quote.textContent = "You have to say YES now! 😊";
                }
                
                if (clickCount > 3) {
                    noBtn.style.padding = `${Math.max(10, 20 - clickCount)}px ${Math.max(30, 60 - clickCount*5)}px`;
                    noBtn.style.fontSize = `${Math.max(1, 2 - clickCount*0.1)}rem`;
                }
            });
            
            yesBtn.addEventListener('click', function() {
                window.location.href = 'her.html';
            });
            
            // Only add hover effects for non-touch devices
            if (window.matchMedia("(hover: hover)").matches) {
                yesBtn.addEventListener('mouseenter', function() {
                    yesBtn.style.transform = `scale(${yesSize * 1.1})`;
                });
                
                yesBtn.addEventListener('mouseleave', function() {
                    yesBtn.style.transform = `scale(${yesSize})`;
                });
            }
        });
    </script>
</body>
</html>
